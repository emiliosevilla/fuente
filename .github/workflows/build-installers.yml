name: Build Fuente installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            artifacts: |
              dist/Fuente_Distribucion_macOS.zip
              dist/Fuente_Distribucion_macOS.dmg
          - name: Windows
            runner: windows-latest
            artifacts: dist/Fuente_Distribucion_Windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install ".[webview,dev,test]"
      - name: Verify packaging contract
        run: python -m pytest -q tests/test_packaging_fuente.py
      - name: Build installer
        run: python build_installer.py
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fuente-installer-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
