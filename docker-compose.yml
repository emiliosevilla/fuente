version: '3.8'

services:
  fuente:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuente_knowledge_base
    restart: unless-stopped
    volumes:
      # Montar la carpeta local del Vault de Obsidian dentro del contenedor
      - ./ObsidianVault:/vault
    environment:
      - OLLAMA_URL=http://ollama:11434
      - ALLOW_NON_LOOPBACK_OLLAMA=true
    depends_on:
      - ollama

  ollama:
    # Ollama starts empty — pull at least one model before first useful ingest:
    #   docker exec -it fuente_ollama_service ollama pull qwen2.5:7b
    image: ollama/ollama:latest
    container_name: fuente_ollama_service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

volumes:
  ollama_storage:
