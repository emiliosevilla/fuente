[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funes"
version = "0.1.0"
description = "ETL Knowledge Base autónomo con IA local y RAG para Obsidian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0.0",
    "psutil>=5.9.0",
    "chromadb>=0.5.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "extract-msg>=0.48.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
funes = "funes.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["funes*"]

[tool.setuptools.package-data]
"funes.infrastructure.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

