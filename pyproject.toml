[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funes"
version = "0.1.0"
description = "ETL Knowledge Base autónomo con IA local y RAG para Obsidian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog~=6.0.0",
    "psutil~=7.2.0",
    "chromadb~=1.5.0",
    "requests~=2.34.0",
    "pydantic~=2.13.0",
    "pyyaml~=6.0.0",
    "python-docx~=1.2.0",
    "pdfplumber~=0.11.0",
    "openpyxl~=3.1.0",
    "python-pptx~=1.0.0",
    "extract-msg~=0.56.0",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
]

[project.scripts]
funes = "funes.main:main"

[project.optional-dependencies]
webview = [
    "pywebview~=6.2.0",
]
audio = [
    "faster-whisper~=1.2.0",
]
ocr = [
    "pillow~=12.2.0",
    "pytesseract~=0.3.13",
]
office = [
    "markitdown~=0.1.7",
    "docling~=2.118.0",
]
dev = [
    "pyinstaller~=6.21.0",
]
test = [
    "pytest>=8.0.0",
]
all = [
    "pywebview~=6.2.0",
    "faster-whisper~=1.2.0",
    "pillow~=12.2.0",
    "pytesseract~=0.3.13",
    "markitdown~=0.1.7",
    "docling~=2.118.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["funes*"]

[tool.setuptools.package-data]
"funes.infrastructure.migrations" = ["*.sql"]
"funes.ui.static" = ["*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
