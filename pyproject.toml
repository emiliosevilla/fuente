[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuente"
version = "0.1.0"
description = "ETL Knowledge Base autónomo con IA local y RAG para Obsidian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog~=6.0.0",
    "psutil~=7.2.0",
    "chromadb==0.6.3",
    "requests~=2.34.0",
    "pydantic~=2.13.0",
    "pyyaml~=6.0.0",
    "python-docx~=1.2.0",
    "pdfplumber~=0.11.0",
    "openpyxl~=3.1.0",
    "python-pptx~=1.0.0",
    "extract-msg~=0.56.0",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
]

[project.scripts]
fuente = "fuente.main:main"

[project.optional-dependencies]
webview = [
    "pywebview~=6.2.0",
]
audio = [
    "faster-whisper~=1.2.0",
]
ocr = [
    "pillow~=12.2.0",
    "pytesseract~=0.3.13",
]
office = [
    "markitdown~=0.1.7",
    "docling~=2.118.0",
]
rag = [
    "minirag-hku @ git+https://github.com/HKUDS/MiniRAG.git@e204d239421f45004852953679927fdf6733f236",
    "json-repair~=0.63.3",
    "tiktoken~=0.14.0",
    "nltk~=3.10.3",
    "rouge~=1.0.1",
    "sentence-transformers~=6.0.0",
    "scikit-learn~=1.9.0",
    "nano-vectordb~=0.0.4.3",
    "pipmaster~=1.1.13",
]
dev = [
    "pyinstaller~=6.21.0",
]
test = [
    "pytest>=8.0.0",
]
all = [
    "pywebview~=6.2.0",
    "faster-whisper~=1.2.0",
    "pillow~=12.2.0",
    "pytesseract~=0.3.13",
    "markitdown~=0.1.7",
    "docling~=2.118.0",
    "minirag-hku @ git+https://github.com/HKUDS/MiniRAG.git@e204d239421f45004852953679927fdf6733f236",
    "json-repair~=0.63.3",
    "tiktoken~=0.14.0",
    "nltk~=3.10.3",
    "rouge~=1.0.1",
    "sentence-transformers~=6.0.0",
    "scikit-learn~=1.9.0",
    "nano-vectordb~=0.0.4.3",
    "pipmaster~=1.1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fuente*"]

[tool.setuptools.package-data]
"fuente.infrastructure.migrations" = ["*.sql"]
"fuente.ui.static" = ["*.css"]
"fuente.resources.demo_vault" = ["manifest.json", "notes/*.txt"]
"fuente.resources" = ["obsidian/*.json", "templates/*/*.md", "agents/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
